sonar.projectKey=ansible_awx
sonar.organization=ansible

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=AWX
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Specify the coverage report
sonar.python.coverage.reportPaths=./reports/coverage.xml

# Ignore "Hard-coded credentials are security-sensitive"
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=awx/awx/ui/**/*.test.js

sonar.issue.ignore.multicriteria.e2.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.e2.resourceKey=awx/awx/**/tests/**/*.py,awx_collection/test/**/*.py

